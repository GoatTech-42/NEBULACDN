name: catalog-check

on:
  pull_request:
    paths:
      - 'games/**'
      - 'games.json'
      - '.github/workflows/catalog-check.yml'
  push:
    paths:
      - 'games/**'
      - 'games.json'
      - '.github/workflows/catalog-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run catalog integrity checker
        run: python3 scripts/check_catalog.py
